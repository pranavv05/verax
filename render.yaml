# Render Blueprint — deploys the full Verax stack in one click.
# Docs: https://render.com/docs/blueprint-spec
#
# AFTER deploying, set these env vars manually in the Render dashboard
# (marked with sync: false below):
#   - JWT_SECRET           (min 32 random chars)
#   - JWT_REFRESH_SECRET   (min 32 random chars, different from JWT_SECRET)
#   - AWS_S3_BUCKET
#   - AWS_ACCESS_KEY_ID
#   - AWS_SECRET_ACCESS_KEY
#   - GROQ_API_KEY
#   - FRONTEND_URL         (your Vercel URL, e.g. https://your-app.vercel.app)
#   - AI_SERVICE_URL       (https://verax-ai-service.onrender.com — set after AI service deploys)
#   - AI_SERVICE_API_KEY   (same random 32+ char value on backend, AI service, and worker)
#
# Then in Vercel, set:
#   - VITE_API_BASE_URL = the URL of verax-backend shown in Render dashboard

databases:
  - name: verax-postgres
    databaseName: ca_saas
    user: ca_user
    plan: free

services:
  - type: redis
    name: verax-redis
    plan: free
    ipAllowList: []

  - type: web
    name: verax-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run migrate:latest && npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: verax-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: verax-redis
          type: redis
          property: connectionString
      # Set AI_SERVICE_URL manually after deploy: https://verax-ai-service.onrender.com
      - key: AI_SERVICE_URL
        sync: false
      - key: AI_SERVICE_TIMEOUT_MS
        value: 120000
      - key: AI_SERVICE_API_KEY
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      - key: MAGIC_LINK_SINGLE_USE
        value: "true"
      - key: MAGIC_LINK_EXPIRY_HOURS
        value: 24
      - key: UPLOAD_URL_EXPIRY_SECONDS
        value: 900
      - key: TALLY_EXPORT_URL_EXPIRY_SECONDS
        value: 900
      - key: MAX_UPLOAD_MB
        value: 50
      - key: MAX_TOOL_UPLOAD_MB
        value: 25
      - key: DOCUMENT_WORKER_CONCURRENCY
        value: 3
      # Set these manually in the Render dashboard after deploy:
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: verax-ai-service
    runtime: docker
    rootDir: ai-service
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port 8001
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: verax-postgres
          property: connectionString
      - key: AWS_REGION
        value: ap-south-1
      - key: AI_SERVICE_PORT
        value: 8001
      - key: AI_SERVICE_API_KEY
        sync: false
      - key: AI_WRITE_BACK_ENABLED
        value: "true"
      - key: LLM_TIMEOUT_SECONDS
        value: 60
      - key: MAX_PDF_PAGES_FOR_FALLBACK
        value: 3
      - key: MAX_TOOL_UPLOAD_MB
        value: 25
      # Set these manually in the Render dashboard after deploy:
      - key: GROQ_API_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

  - type: worker
    name: verax-worker
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run worker:documents
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: verax-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: verax-redis
          type: redis
          property: connectionString
      # Set AI_SERVICE_URL manually after deploy: https://verax-ai-service.onrender.com
      - key: AI_SERVICE_URL
        sync: false
      - key: AI_SERVICE_TIMEOUT_MS
        value: 120000
      - key: AI_SERVICE_API_KEY
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      - key: MAGIC_LINK_SINGLE_USE
        value: "true"
      - key: MAGIC_LINK_EXPIRY_HOURS
        value: 24
      - key: UPLOAD_URL_EXPIRY_SECONDS
        value: 900
      - key: TALLY_EXPORT_URL_EXPIRY_SECONDS
        value: 900
      - key: MAX_UPLOAD_MB
        value: 50
      - key: MAX_TOOL_UPLOAD_MB
        value: 25
      - key: DOCUMENT_WORKER_CONCURRENCY
        value: 3
      # Set these manually in the Render dashboard after deploy:
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
