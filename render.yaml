# Render Blueprint — deploys the full Verax stack in one click.
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy target: Render hosts backend + worker + ai-service + Postgres + Redis
# (this file). The frontend is a static Vite build and is deployed separately
# on Vercel — see frontend/README or the repo root README for that step.
#
# Instance plans below are sized for real client data, not the free tier:
#   - verax-ai-service: 1c-2g (2 GB, always on). PaddleOCR needs ~2 GB, and a
#     free instance (512 MB, spins down on idle) either runs out of memory or
#     fails the first request after every idle period while models reload.
#     Runs a single uvicorn worker: extra processes on one CPU add no
#     throughput but multiply PaddleOCR's memory.
#   - verax-backend / verax-worker: 0.5c-512mb, so the API never spins down
#     mid-session and queued documents are always being processed.
#   - verax-redis: 256mb with maxmemoryPolicy noeviction. Render's default
#     policy (allkeys-lru) may silently evict BullMQ job keys under memory
#     pressure, losing queued documents; BullMQ requires noeviction.
#
# DOMAINS — frontend and API MUST share one registrable domain, e.g.
# app.yourdomain.in (Vercel) + api.yourdomain.in (verax-backend custom
# domain). The refresh-token cookie is SameSite=Strict and the access token
# lives only in memory, so every page load re-authenticates via that cookie.
# *.vercel.app and *.onrender.com are separate sites to browsers, which never
# send a SameSite cookie between them — on the default domains, every reload
# logs the user out. (The backend logs a warning at boot if FRONTEND_URL is
# on such a platform domain.)
#
# S3 bucket CORS — the browser uploads to and downloads from S3 directly, so
# the bucket needs a CORS rule for the frontend origin:
#   [{"AllowedOrigins": ["https://app.yourdomain.in"],
#     "AllowedMethods": ["PUT", "GET"], "AllowedHeaders": ["*"],
#     "ExposeHeaders": ["ETag"], "MaxAgeSeconds": 3000}]
#
# verax-postgres MUST run on a paid plan, not `free`, before any real client
# data is stored. Render's free Postgres tier is explicitly ephemeral: it is
# deleted ~30 days after creation with no way to renew it in place and no
# backups — every extraction, client, and audit-log row would be gone with no
# recovery path. `basic-1gb` is the minimum paid plan that gets you automated
# daily backups and point-in-time recovery; size up from there based on data
# volume. See https://render.com/docs/postgresql-plans.
#
# AFTER deploying, set these env vars manually in the Render dashboard
# (marked with sync: false below):
#   - JWT_SECRET           (min 32 random chars)
#   - JWT_REFRESH_SECRET   (min 32 random chars, different from JWT_SECRET)
#   - CLIENT_JWT_SECRET    (min 32 random chars, different from the two above —
#                            required at backend startup, the app will not boot without it)
#   - AWS_S3_BUCKET
#   - AWS_ACCESS_KEY_ID
#   - AWS_SECRET_ACCESS_KEY
#   - GROQ_API_KEY
#   - FRONTEND_URL         (your frontend's custom domain, e.g. https://app.yourdomain.in —
#                            see DOMAINS above; not the *.vercel.app URL)
#   - AI_SERVICE_URL       (https://verax-ai-service.onrender.com — set after AI service deploys)
#   - AI_SERVICE_API_KEY   (same random 32+ char value on backend, AI service, and worker)
#   - SMTP_HOST / SMTP_USER / SMTP_PASS  (required for magic-link, password-reset and
#                            document-ready notification emails to actually send —
#                            without these, EMAIL_PROVIDER defaults to "smtp" with no
#                            host configured and email sending silently fails)
#   - SENTRY_DSN           (optional, backend + worker — error reporting; unset = disabled)
#
# Then in Vercel, set:
#   - VITE_API_BASE_URL = verax-backend's custom domain, e.g. https://api.yourdomain.in

databases:
  - name: verax-postgres
    databaseName: ca_saas
    user: ca_user
    # NOT `free` — Render's free Postgres tier is deleted ~30 days after
    # creation with no backups. See the note above before deploying.
    plan: basic-1gb

services:
  - type: redis
    name: verax-redis
    # Paid plan: the free Key Value tier has no persistence and 25 MB.
    plan: 256mb
    # BullMQ requires noeviction — see the header note.
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: verax-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run migrate:latest && npm start
    plan: 0.5c-512mb
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render's edge is exactly one proxy hop in front of the app — without
      # this, req.ip is the proxy's address and every user shares one
      # rate-limit bucket. See TRUST_PROXY in backend/src/config/env.js.
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: verax-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: verax-redis
          type: redis
          property: connectionString
      # Set AI_SERVICE_URL manually after deploy: https://verax-ai-service.onrender.com
      - key: AI_SERVICE_URL
        sync: false
      - key: AI_SERVICE_TIMEOUT_MS
        value: 900000
      - key: AI_SERVICE_API_KEY
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      - key: MAGIC_LINK_SINGLE_USE
        value: "false"
      - key: MAGIC_LINK_EXPIRY_HOURS
        value: 720
      - key: UPLOAD_URL_EXPIRY_SECONDS
        value: 900
      - key: TALLY_EXPORT_URL_EXPIRY_SECONDS
        value: 900
      - key: MAX_UPLOAD_MB
        value: 50
      - key: MAX_TOOL_UPLOAD_MB
        value: 25
      - key: DOCUMENT_WORKER_CONCURRENCY
        value: 3
      - key: DB_POOL_MAX
        value: 10
      - key: DB_POOL_IDLE_TIMEOUT_MS
        value: 30000
      - key: DB_POOL_CONNECTION_TIMEOUT_MS
        value: 5000
      - key: DB_STATEMENT_TIMEOUT_MS
        value: 30000
      # Set these manually in the Render dashboard after deploy:
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLIENT_JWT_SECRET
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: web
    name: verax-ai-service
    runtime: docker
    rootDir: ai-service
    dockerfilePath: ./Dockerfile.prod
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port 8001 --workers 1
    plan: 1c-2g
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: verax-postgres
          property: connectionString
      - key: AWS_REGION
        value: ap-south-1
      - key: AI_SERVICE_PORT
        value: 8001
      - key: AI_SERVICE_API_KEY
        sync: false
      - key: AI_WRITE_BACK_ENABLED
        value: "true"
      - key: LLM_TIMEOUT_SECONDS
        value: 60
      - key: OCR_TIMEOUT_SECONDS
        value: 120
      - key: MAX_PDF_PAGES_FOR_FALLBACK
        value: 3
      - key: MAX_TOOL_UPLOAD_MB
        value: 25
      # Set these manually in the Render dashboard after deploy:
      - key: GROQ_API_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

  - type: worker
    name: verax-worker
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run worker:documents
    plan: 0.5c-512mb
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: verax-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: verax-redis
          type: redis
          property: connectionString
      # Set AI_SERVICE_URL manually after deploy: https://verax-ai-service.onrender.com
      - key: AI_SERVICE_URL
        sync: false
      - key: AI_SERVICE_TIMEOUT_MS
        value: 900000
      - key: AI_SERVICE_API_KEY
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      - key: MAGIC_LINK_SINGLE_USE
        value: "false"
      - key: MAGIC_LINK_EXPIRY_HOURS
        value: 720
      - key: UPLOAD_URL_EXPIRY_SECONDS
        value: 900
      - key: TALLY_EXPORT_URL_EXPIRY_SECONDS
        value: 900
      - key: MAX_UPLOAD_MB
        value: 50
      - key: MAX_TOOL_UPLOAD_MB
        value: 25
      - key: DOCUMENT_WORKER_CONCURRENCY
        value: 3
      - key: DB_POOL_MAX
        value: 10
      - key: DB_POOL_IDLE_TIMEOUT_MS
        value: 30000
      - key: DB_POOL_CONNECTION_TIMEOUT_MS
        value: 5000
      - key: DB_STATEMENT_TIMEOUT_MS
        value: 30000
      # Set these manually in the Render dashboard after deploy:
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLIENT_JWT_SECRET
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: SENTRY_DSN
        sync: false
