# Production docker-compose — use with:
#   docker compose -f docker-compose.prod.yml up -d
#
# Required env vars (set in your .env or CI secrets):
#   POSTGRES_PASSWORD, DATABASE_URL, REDIS_URL
#   JWT_SECRET, JWT_REFRESH_SECRET, CLIENT_JWT_SECRET  (min 32 random chars each,
#     CLIENT_JWT_SECRET must differ from the other two)
#   AWS_S3_BUCKET, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   GROQ_API_KEY, AI_SERVICE_API_KEY
#   VITE_API_BASE_URL  (public URL of backend, e.g. https://api.example.com)
#   FRONTEND_URL       (public URL of frontend, e.g. https://example.com)

services:
  postgres:
    image: postgres:15
    container_name: ca-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ca_saas}
      POSTGRES_USER: ${POSTGRES_USER:-ca_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # No ports exposed — accessed only inside the Docker network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: ca-redis
    restart: unless-stopped
    # No ports exposed — accessed only inside the Docker network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ca-backend:prod
    container_name: ca-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8001}
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY}
      AI_SERVICE_TIMEOUT_MS: ${AI_SERVICE_TIMEOUT_MS:-120000}
      FRONTEND_URL: ${FRONTEND_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CLIENT_JWT_SECRET: ${CLIENT_JWT_SECRET}
      CLIENT_JWT_EXPIRY: ${CLIENT_JWT_EXPIRY:-15m}
      CLIENT_REFRESH_TOKEN_EXPIRY_DAYS: ${CLIENT_REFRESH_TOKEN_EXPIRY_DAYS:-30}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-ca_refresh_token}
      MAGIC_LINK_SINGLE_USE: ${MAGIC_LINK_SINGLE_USE:-true}
      MAGIC_LINK_EXPIRY_HOURS: ${MAGIC_LINK_EXPIRY_HOURS:-24}
      UPLOAD_URL_EXPIRY_SECONDS: ${UPLOAD_URL_EXPIRY_SECONDS:-900}
      TALLY_EXPORT_URL_EXPIRY_SECONDS: ${TALLY_EXPORT_URL_EXPIRY_SECONDS:-900}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      MAX_TOOL_UPLOAD_MB: ${MAX_TOOL_UPLOAD_MB:-25}
      DOCUMENT_WORKER_CONCURRENCY: ${DOCUMENT_WORKER_CONCURRENCY:-3}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    image: ca-frontend:prod
    container_name: ca-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - backend

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile.prod
    image: ca-ai-service:prod
    container_name: ca-ai-service
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AI_SERVICE_PORT: 8001
      GROQ_API_KEY: ${GROQ_API_KEY}
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY}
      AI_WRITE_BACK_ENABLED: ${AI_WRITE_BACK_ENABLED:-true}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      MAX_PDF_PAGES_FOR_FALLBACK: ${MAX_PDF_PAGES_FOR_FALLBACK:-3}
      MAX_TOOL_UPLOAD_MB: ${MAX_TOOL_UPLOAD_MB:-25}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
    # No ports exposed — backend calls it via internal Docker network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ca-backend:prod
    container_name: ca-worker
    restart: unless-stopped
    command: ["node", "src/workers/document-processing.worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8001}
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY}
      AI_SERVICE_TIMEOUT_MS: ${AI_SERVICE_TIMEOUT_MS:-120000}
      DOCUMENT_WORKER_CONCURRENCY: ${DOCUMENT_WORKER_CONCURRENCY:-3}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CLIENT_JWT_SECRET: ${CLIENT_JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-ca_refresh_token}
      MAGIC_LINK_SINGLE_USE: ${MAGIC_LINK_SINGLE_USE:-true}
      MAGIC_LINK_EXPIRY_HOURS: ${MAGIC_LINK_EXPIRY_HOURS:-24}
      UPLOAD_URL_EXPIRY_SECONDS: ${UPLOAD_URL_EXPIRY_SECONDS:-900}
      TALLY_EXPORT_URL_EXPIRY_SECONDS: ${TALLY_EXPORT_URL_EXPIRY_SECONDS:-900}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      MAX_TOOL_UPLOAD_MB: ${MAX_TOOL_UPLOAD_MB:-25}
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f document-processing.worker.js || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
