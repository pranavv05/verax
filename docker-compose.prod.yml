# Production docker-compose — use with:
#   docker compose -f docker-compose.prod.yml up -d
#
# Required env vars (set in your .env or CI secrets):
#   POSTGRES_PASSWORD, DATABASE_URL, REDIS_URL
#   JWT_SECRET, JWT_REFRESH_SECRET, CLIENT_JWT_SECRET  (min 32 random chars each,
#     CLIENT_JWT_SECRET must differ from the other two)
#   AWS_S3_BUCKET, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   GROQ_API_KEY, AI_SERVICE_API_KEY
#   APP_DOMAIN, API_DOMAIN  (e.g. app.yourdomain.in / api.yourdomain.in — the
#     `caddy` service serves them over HTTPS with automatic Let's Encrypt
#     certificates. Both MUST be subdomains of one registrable domain: the
#     refresh cookie is SameSite=Strict and is only sent same-site.)
#   ACME_EMAIL         (contact address for Let's Encrypt expiry notices)
#   VITE_API_BASE_URL  (https://<API_DOMAIN>)
#   FRONTEND_URL       (https://<APP_DOMAIN>)
#   Email: EMAIL_PROVIDER plus RESEND_API_KEY, or SMTP_HOST/SMTP_USER/SMTP_PASS
#     — without these, magic-link, password-reset, invite and document
#     notification emails are silently not sent.
#
# Optional: SENTRY_DSN (backend + worker error reporting), GSP_* (live GSTIN
# lookup), BACKUP_RETENTION_DAYS (default 14), AI_SERVICE_MEMORY_LIMIT (4g).
#
# Only `caddy` publishes ports (80/443). The backend and frontend are reachable
# solely through it, so the backend's TRUST_PROXY=1 matches the real topology.
#
# BACKUPS: `db-backup` writes a pg_dump custom-format archive to the
# postgres_backups volume at start-up and every 24h, keeping
# BACKUP_RETENTION_DAYS days. That volume lives on the same host as the
# database — copy it off-host (e.g. `aws s3 sync`, or your VPS provider's
# volume snapshots) or a host failure still loses everything. Restore with:
#   docker compose -f docker-compose.prod.yml exec db-backup \
#     pg_restore --clean --if-exists -d "$POSTGRES_DB" /backups/<file>.dump
#
# APP_DATABASE_URL — set this or tenant isolation does not work:
#   DATABASE_URL above connects as the postgres image's bootstrap role, which
#   is a Postgres SUPERUSER. Postgres never applies Row Level Security to a
#   superuser, so without APP_DATABASE_URL, every firm's data is readable by
#   every other firm through this deployment path — the RLS policies exist
#   but are silently bypassed. Run migrations first (they create the
#   least-privilege `ca_app` role), then set:
#     APP_DB_PASSWORD=<a strong random password>
#     APP_DATABASE_URL=postgresql://ca_app:<APP_DB_PASSWORD>@postgres:5432/${POSTGRES_DB:-ca_saas}
#   Migrations still need DATABASE_URL's DDL rights, so keep both set.

services:
  postgres:
    image: postgres:15
    container_name: ca-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ca_saas}
      POSTGRES_USER: ${POSTGRES_USER:-ca_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # No ports exposed — accessed only inside the Docker network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: ca-redis
    restart: unless-stopped
    # No ports exposed — accessed only inside the Docker network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ca-backend:prod
    container_name: ca-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      # See the APP_DATABASE_URL comment block at the top of this file —
      # required for RLS tenant isolation to actually apply.
      APP_DATABASE_URL: ${APP_DATABASE_URL}
      # Read by the least-privilege-role migration (run in this container via
      # `run --rm backend npm run migrate:latest`) to set ca_app's password.
      # Without it the migration falls back to the dev-only password that is
      # committed in the repo, and APP_DATABASE_URL then fails to connect.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD, the password in APP_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8001}
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY}
      AI_SERVICE_TIMEOUT_MS: ${AI_SERVICE_TIMEOUT_MS:-900000}
      FRONTEND_URL: ${FRONTEND_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CLIENT_JWT_SECRET: ${CLIENT_JWT_SECRET}
      CLIENT_JWT_EXPIRY: ${CLIENT_JWT_EXPIRY:-15m}
      CLIENT_REFRESH_TOKEN_EXPIRY_DAYS: ${CLIENT_REFRESH_TOKEN_EXPIRY_DAYS:-30}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-ca_refresh_token}
      MAGIC_LINK_SINGLE_USE: ${MAGIC_LINK_SINGLE_USE:-false}
      MAGIC_LINK_EXPIRY_HOURS: ${MAGIC_LINK_EXPIRY_HOURS:-720}
      UPLOAD_URL_EXPIRY_SECONDS: ${UPLOAD_URL_EXPIRY_SECONDS:-900}
      TALLY_EXPORT_URL_EXPIRY_SECONDS: ${TALLY_EXPORT_URL_EXPIRY_SECONDS:-900}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      MAX_TOOL_UPLOAD_MB: ${MAX_TOOL_UPLOAD_MB:-25}
      DOCUMENT_WORKER_CONCURRENCY: ${DOCUMENT_WORKER_CONCURRENCY:-3}
      # Exactly one proxy hop (the caddy service) sits in front of the API.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Verax TallyOCR}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@verax.in}
      DEMO_NOTIFICATION_EMAIL: ${DEMO_NOTIFICATION_EMAIL:-verax.hello@gmail.com}
      GSP_API_URL: ${GSP_API_URL:-https://gsp.adaequare.com}
      GSP_USERNAME: ${GSP_USERNAME:-}
      GSP_PASSWORD: ${GSP_PASSWORD:-}
      GSP_DISABLED: ${GSP_DISABLED:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
    # No host port — reached only through the caddy service.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    image: ca-frontend:prod
    container_name: ca-frontend
    restart: unless-stopped
    # No host port — reached only through the caddy service.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - backend

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile.prod
    image: ca-ai-service:prod
    container_name: ca-ai-service
    restart: unless-stopped
    # PaddleOCR needs ~2 GB. The limit stops one pathological document from
    # exhausting the host (and taking Postgres down with it) — the container
    # is killed and restarted instead, and BullMQ retries the job.
    deploy:
      resources:
        reservations:
          memory: 2g
        limits:
          memory: ${AI_SERVICE_MEMORY_LIMIT:-4g}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_DATABASE_URL: ${APP_DATABASE_URL}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AI_SERVICE_PORT: 8001
      GROQ_API_KEY: ${GROQ_API_KEY}
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY}
      AI_WRITE_BACK_ENABLED: ${AI_WRITE_BACK_ENABLED:-true}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-120}
      MAX_PDF_PAGES_FOR_FALLBACK: ${MAX_PDF_PAGES_FOR_FALLBACK:-3}
      MAX_TOOL_UPLOAD_MB: ${MAX_TOOL_UPLOAD_MB:-25}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
    # No ports exposed — backend calls it via internal Docker network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ca-backend:prod
    container_name: ca-worker
    restart: unless-stopped
    command: ["node", "src/workers/document-processing.worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      APP_DATABASE_URL: ${APP_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8001}
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY}
      AI_SERVICE_TIMEOUT_MS: ${AI_SERVICE_TIMEOUT_MS:-900000}
      DOCUMENT_WORKER_CONCURRENCY: ${DOCUMENT_WORKER_CONCURRENCY:-3}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CLIENT_JWT_SECRET: ${CLIENT_JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-ca_refresh_token}
      MAGIC_LINK_SINGLE_USE: ${MAGIC_LINK_SINGLE_USE:-false}
      MAGIC_LINK_EXPIRY_HOURS: ${MAGIC_LINK_EXPIRY_HOURS:-720}
      UPLOAD_URL_EXPIRY_SECONDS: ${UPLOAD_URL_EXPIRY_SECONDS:-900}
      TALLY_EXPORT_URL_EXPIRY_SECONDS: ${TALLY_EXPORT_URL_EXPIRY_SECONDS:-900}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      MAX_TOOL_UPLOAD_MB: ${MAX_TOOL_UPLOAD_MB:-25}
      # The worker sends document-ready / permanent-failure emails.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Verax TallyOCR}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@verax.in}
      GSP_API_URL: ${GSP_API_URL:-https://gsp.adaequare.com}
      GSP_USERNAME: ${GSP_USERNAME:-}
      GSP_PASSWORD: ${GSP_PASSWORD:-}
      GSP_DISABLED: ${GSP_DISABLED:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f document-processing.worker.js || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started

  caddy:
    build:
      context: ./deploy/caddy
    image: ca-caddy:prod
    container_name: ca-caddy
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN, e.g. app.yourdomain.in}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN, e.g. api.yourdomain.in}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL for Let's Encrypt expiry notices}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Named volumes, not bind mounts: issued certificates must survive
      # restarts or Let's Encrypt rate limits will block re-issuance.
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - backend
      - frontend

  db-backup:
    image: postgres:15
    container_name: ca-db-backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-ca_user}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-ca_saas}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    # Dumps as the bootstrap superuser (RLS does not apply to it), so the
    # archive holds every firm's rows. Writes to a .partial file and renames
    # only on success, so a failed dump never masquerades as a good one.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          ts=$$(date -u +%Y%m%dT%H%M%SZ)
          out="/backups/$${PGDATABASE}-$${ts}.dump"
          if pg_dump --format=custom --file="$${out}.partial"; then
            mv "$${out}.partial" "$${out}"
            echo "backup ok: $${out}"
          else
            rm -f "$${out}.partial"
            echo "backup FAILED at $${ts}" >&2
          fi
          find /backups -name '*.dump' -mtime +$${BACKUP_RETENTION_DAYS} -delete
          sleep 86400
        done
    volumes:
      - postgres_backups:/backups
    healthcheck:
      # Unhealthy if there is no successful dump from the last 26 hours.
      test: ["CMD-SHELL", "find /backups -name '*.dump' -mmin -1560 | grep -q ."]
      interval: 1h
      timeout: 10s
      retries: 1
      start_period: 10m
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  postgres_backups:
  caddy_data:
  caddy_config:
