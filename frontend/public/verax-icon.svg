<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Verax">
  <title>Verax</title>
  <!--
    Two overlapping angular chevrons pointing right.

    The chevron is simultaneously forward movement (a document advancing through
    the pipeline) and a tick rotated onto its side — verification, which is what
    "verax" means. Two of them, offset, say "stage after stage".

    The overlap is drawn as an explicit third path clipped to the left chevron
    rather than relying on mix-blend-mode, so it renders identically in
    favicons, email clients and anywhere else blend modes get stripped.
  -->
  <defs>
    <clipPath id="veraxIconOverlap">
      <path d="M10 5 19.5 16 10 27 4 27 13.5 16 4 5Z"/>
    </clipPath>
  </defs>

  <!-- Left chevron — indigo -->
  <path d="M10 5 19.5 16 10 27 4 27 13.5 16 4 5Z" fill="#6366F1"/>

  <!-- Right chevron — white -->
  <path d="M18.5 5 28 16 18.5 27 12.5 27 22 16 12.5 5Z" fill="#F2F2F3"/>

  <!-- Overlap: indigo at 60% over the white chevron, giving a layered third tone -->
  <g clip-path="url(#veraxIconOverlap)">
    <path d="M18.5 5 28 16 18.5 27 12.5 27 22 16 12.5 5Z" fill="#6366F1" fill-opacity="0.6"/>
  </g>
</svg>
