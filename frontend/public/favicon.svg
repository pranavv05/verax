<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Verax">
  <title>Verax</title>
  <!--
    Same mark as verax-icon.svg, with heavier limbs (7px of horizontal thickness
    instead of 6) and a tighter offset so the two chevrons stay legible as two
    at 16px. Sits on a rounded canvas chip so it holds shape against a light
    browser tab as well as a dark one.
  -->
  <defs>
    <clipPath id="veraxFaviconOverlap">
      <path d="M10.5 5 20 16 10.5 27 3.5 27 13 16 3.5 5Z"/>
    </clipPath>
  </defs>

  <rect width="32" height="32" rx="8" fill="#0A0A0B"/>

  <path d="M10.5 5 20 16 10.5 27 3.5 27 13 16 3.5 5Z" fill="#6366F1"/>
  <path d="M19 5 28.5 16 19 27 12 27 21.5 16 12 5Z" fill="#F2F2F3"/>

  <g clip-path="url(#veraxFaviconOverlap)">
    <path d="M19 5 28.5 16 19 27 12 27 21.5 16 12 5Z" fill="#6366F1" fill-opacity="0.6"/>
  </g>
</svg>
