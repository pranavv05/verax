<html lang="en">

         mobile browser chrome blends with the page instead of framing it. -->

    <meta property="og:site_name" content="Verax" />
    <meta property="og:title" content="Verax — Financial Document Intelligence for CA Firms" />

    <meta property="og:image" content="/verax-logo.svg" />

    <!-- No og:url / canonical: the production domain isn't configured
         anywhere in this repository, and a wrong canonical is worse than
         none. Add both here once the domain is known. -->

    <meta name="twitter:title" content="Verax — Financial Document Intelligence for CA Firms" />

      name="twitter:description"
      content="Financial documents in, accounting-ready data out. Built for Indian CA firms."
    />
