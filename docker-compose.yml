services:
  postgres:
    image: postgres:15
    container_name: ca-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ca_saas}
      POSTGRES_USER: ${POSTGRES_USER:-ca_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ca_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: ca-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: node:20-alpine
    container_name: ca-backend
    restart: unless-stopped
    working_dir: /app
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://ca_user:ca_password@postgres:5432/ca_saas}
      # Least-privilege role for the app's runtime queries — see the
      # APP_DATABASE_URL comment in backend/src/config/env.js. DATABASE_URL
      # above (the postgres bootstrap superuser) is still what `npm run
      # migrate:latest` uses, since migrations need DDL rights this role
      # intentionally lacks.
      APP_DATABASE_URL: postgresql://ca_app:${APP_DB_PASSWORD:-ca_app_dev_password_change_me}@postgres:5432/${POSTGRES_DB:-ca_saas}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      LOCAL_STORAGE: ${LOCAL_STORAGE:-true}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-./local-storage}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8001}
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-local_ai_service_api_key_change_me_32}
      AI_SERVICE_TIMEOUT_MS: ${AI_SERVICE_TIMEOUT_MS:-120000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_too}
      CLIENT_JWT_SECRET: ${CLIENT_JWT_SECRET:-client_portal_change_me_min_32_chars_long}
      CLIENT_JWT_EXPIRY: ${CLIENT_JWT_EXPIRY:-15m}
      CLIENT_REFRESH_TOKEN_EXPIRY_DAYS: ${CLIENT_REFRESH_TOKEN_EXPIRY_DAYS:-30}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-ca_refresh_token}
      MAGIC_LINK_SINGLE_USE: ${MAGIC_LINK_SINGLE_USE:-true}
      MAGIC_LINK_EXPIRY_HOURS: ${MAGIC_LINK_EXPIRY_HOURS:-24}
      UPLOAD_URL_EXPIRY_SECONDS: ${UPLOAD_URL_EXPIRY_SECONDS:-900}
      TALLY_EXPORT_URL_EXPIRY_SECONDS: ${TALLY_EXPORT_URL_EXPIRY_SECONDS:-900}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      MAX_TOOL_UPLOAD_MB: ${MAX_TOOL_UPLOAD_MB:-25}
      DOCUMENT_WORKER_CONCURRENCY: ${DOCUMENT_WORKER_CONCURRENCY:-3}
      # Without these, EMAIL_PROVIDER defaults to "smtp" with no host
      # configured — email.service.js still doesn't error in dev (it logs a
      # preview with the actual link to this container's logs instead), but
      # setting real values here is what makes an actual inbox receive
      # magic-link/password-reset/notification emails during local testing.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Verax TallyOCR}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@verax.in}
      # Live GST Suvidha Provider lookup — optional. Unset, GSTIN
      # verification and GSTR-2B reconciliation both gracefully fall back
      # (local checksum validation / "unavailable" match results) instead
      # of erroring, since a real GSP account needs a paid subscription
      # tied to a real GSTIN that no local dev setup will have.
      GSP_USERNAME: ${GSP_USERNAME:-}
      GSP_PASSWORD: ${GSP_PASSWORD:-}
      GSP_DISABLED: ${GSP_DISABLED:-false}
    command: sh -c "if [ -f package.json ]; then npm install && npm run dev; else tail -f /dev/null; fi"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - ./backend/local-storage:/app/local-storage
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: ca-frontend
    restart: unless-stopped
    working_dir: /app
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    command: sh -c "if [ -f package.json ]; then npm install && npm run dev -- --host 0.0.0.0 --port 5173; else tail -f /dev/null; fi"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    dns:
      - 8.8.8.8
      - 8.8.4.4
    image: ca-ai-service:dev
    container_name: ca-ai-service
    restart: unless-stopped
    working_dir: /app
    environment:
      # Pinned to the compose-internal hostname on purpose: the root .env's
      # DATABASE_URL points at localhost for the host-side backend/worker, which
      # would not resolve to postgres from inside this container.
      DATABASE_URL: postgresql://${POSTGRES_USER:-ca_user}:${POSTGRES_PASSWORD:-ca_password}@postgres:5432/${POSTGRES_DB:-ca_saas}
      # Least-privilege role for extraction write-backs — see APP_DATABASE_URL
      # comment in backend/src/config/env.js.
      APP_DATABASE_URL: postgresql://ca_app:${APP_DB_PASSWORD:-ca_app_dev_password_change_me}@postgres:5432/${POSTGRES_DB:-ca_saas}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AI_SERVICE_PORT: 8001
      # The backend writes uploads to backend/local-storage/<key>; that directory
      # is bind-mounted below so the AI service resolves the same keys.
      LOCAL_STORAGE: ${LOCAL_STORAGE:-false}
      LOCAL_STORAGE_PATH: /mnt/local-storage
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-local_ai_service_api_key_change_me_32}
      AI_WRITE_BACK_ENABLED: ${AI_WRITE_BACK_ENABLED:-true}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      MAX_PDF_PAGES_FOR_FALLBACK: ${MAX_PDF_PAGES_FOR_FALLBACK:-3}
      MAX_TOOL_UPLOAD_MB: ${MAX_TOOL_UPLOAD_MB:-25}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./ai-service:/app
      - ./backend/local-storage:/mnt/local-storage
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: node:20-alpine
    container_name: ca-worker
    restart: unless-stopped
    working_dir: /app
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgresql://ca_user:ca_password@postgres:5432/ca_saas}
      APP_DATABASE_URL: postgresql://ca_app:${APP_DB_PASSWORD:-ca_app_dev_password_change_me}@postgres:5432/${POSTGRES_DB:-ca_saas}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      LOCAL_STORAGE: ${LOCAL_STORAGE:-true}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-./local-storage}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8001}
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-local_ai_service_api_key_change_me_32}
      AI_SERVICE_TIMEOUT_MS: ${AI_SERVICE_TIMEOUT_MS:-120000}
      DOCUMENT_WORKER_CONCURRENCY: ${DOCUMENT_WORKER_CONCURRENCY:-3}
      # Without these, EMAIL_PROVIDER defaults to "smtp" with no host
      # configured — email.service.js still doesn't error in dev (it logs a
      # preview with the actual link to this container's logs instead), but
      # setting real values here is what makes an actual inbox receive
      # magic-link/password-reset/notification emails during local testing.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Verax TallyOCR}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@verax.in}
      # Live GST Suvidha Provider lookup — optional. Unset, GSTIN
      # verification and GSTR-2B reconciliation both gracefully fall back
      # (local checksum validation / "unavailable" match results) instead
      # of erroring, since a real GSP account needs a paid subscription
      # tied to a real GSTIN that no local dev setup will have.
      GSP_USERNAME: ${GSP_USERNAME:-}
      GSP_PASSWORD: ${GSP_PASSWORD:-}
      GSP_DISABLED: ${GSP_DISABLED:-false}
      JWT_SECRET: ${JWT_SECRET:-change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_too}
      CLIENT_JWT_SECRET: ${CLIENT_JWT_SECRET:-client_portal_change_me_min_32_chars_long}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-ca_refresh_token}
      MAGIC_LINK_SINGLE_USE: ${MAGIC_LINK_SINGLE_USE:-true}
      MAGIC_LINK_EXPIRY_HOURS: ${MAGIC_LINK_EXPIRY_HOURS:-24}
      UPLOAD_URL_EXPIRY_SECONDS: ${UPLOAD_URL_EXPIRY_SECONDS:-900}
      TALLY_EXPORT_URL_EXPIRY_SECONDS: ${TALLY_EXPORT_URL_EXPIRY_SECONDS:-900}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      MAX_TOOL_UPLOAD_MB: ${MAX_TOOL_UPLOAD_MB:-25}
    command: sh -c "if [ -f package.json ]; then npm install && npm run worker:documents; else tail -f /dev/null; fi"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - ./backend/local-storage:/app/local-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  backend_node_modules:
  frontend_node_modules:
